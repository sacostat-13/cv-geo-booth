# Static site. The one build step turns the site's environment variables into
# config.js — static pages cannot read environment variables at runtime.
[build]
  publish = "."
  command = "node tools/build-config.js"

[build.environment]
  NODE_VERSION = "20"

# submit.mjs and wall.mjs declare their own /api/* routes.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Repo-only folders: nothing on the site links to them.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/build/*"
  to = "/index.html"
  status = 404

# Tidy URL for the booth screen: /screen instead of /display.html
[[redirects]]
  from = "/screen"
  to = "/display.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The data files are frozen snapshots; let phones and the screen cache them hard.
[[headers]]
  for = "/cv-data.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/world.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# config.js is rewritten on every deploy; never let a cache hold the old one.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"

# The wall is live data; never let a CDN or a browser hold on to it.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
