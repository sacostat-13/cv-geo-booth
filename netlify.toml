# Static site. The one build step turns the site's environment variables into
# config.js — static pages cannot read environment variables at runtime.
[build]
  publish = "."
  command = "node tools/build-config.js"

[build.environment]
  NODE_VERSION = "20"

# quiz.mjs declares its own /api/quiz/* route.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Repo-only folders: nothing on the site links to them.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/data/*"
  to = "/index.html"
  status = 404

# Tidy URLs for the three things that get opened on hardware.
[[redirects]]
  from = "/screen"
  to = "/display.html"
  status = 200
[[redirects]]
  from = "/a"
  to = "/pad.html?station=A"
  status = 200
[[redirects]]
  from = "/b"
  to = "/pad.html?station=B"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The bank and the figures are frozen snapshots, rebuilt only by a deploy.
# Caching them hard is what lets an iPad that has been open all day stop
# asking for them.
[[headers]]
  for = "/bank.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/quiz-data.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# config.js is rewritten on every deploy; never let a cache hold the old one.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"

# The board is live; never let a CDN or a browser hold on to it.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
