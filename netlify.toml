# Static site. The one build step turns the site's environment variables into
# config.js — static pages cannot read environment variables at runtime.
[build]
  publish = "."
  command = "node tools/build-config.js"

[build.environment]
  NODE_VERSION = "20"

# quiz.mjs declares its own /api/quiz/* route.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Repo-only folders: nothing on the site links to them.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/data/*"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/clips-example/*"
  to = "/index.html"
  status = 404

# Tidy URLs for the three things that get opened on hardware.
[[redirects]]
  from = "/screen"
  to = "/display.html"
  status = 200
[[redirects]]
  from = "/a"
  to = "/pad.html?station=A"
  status = 200
[[redirects]]
  from = "/b"
  to = "/pad.html?station=B"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The bank, the figures and the font set change on a deploy and keep their
# filenames, so they must be revalidated rather than cached by age.
#
# These were max-age=86400, on the theory that an iPad open all day should
# stop asking for them. That was wrong in the way that matters: it also means
# a deploy does not reach a pad that loaded the site earlier the same day. It
# is how the first build with audio shipped and the pads went on showing
# Listen as unavailable, because they were still holding yesterday's bank.js.
#
# no-cache does not mean "do not store" — it means "ask before using". The
# answer is a 304 of a few hundred bytes, once per page load, which is a
# price worth paying to never again debug a booth that is running last
# week's questions.
[[headers]]
  for = "/bank.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/quiz-data.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/fonts.css"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "no-cache"

# The clips are the exception, and can be cached hard: every filename is
# unique to its clip, so a changed set is a changed set of names.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# config.js is rewritten on every deploy; never let a cache hold the old one.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-store"

# The board is live; never let a CDN or a browser hold on to it.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
